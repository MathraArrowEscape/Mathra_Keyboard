name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # Debug-signed APK: installs on any phone, needs no keystore/secrets.
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: Mathra-Arrow-Escape-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

